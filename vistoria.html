<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>VeeLo Way — vistoria</title>
<link rel="icon" href="/assets/logo-veeloway.jpeg">
<style>
  :root{
    --bg:#f3f3f3; --card:#ffffff; --line:#e4e4e4; --text:#0d0d0d; --muted:#5e5e5e;
    --brand:#f2e200; --brand-2:#dccb00; --ink:#0a0a0a;
    --ok:#00a865; --danger:#e02f43; --warn:#c47a00;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
    -webkit-text-size-adjust:100%;padding:0 0 44px}
  header{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--ink);
    padding:18px 20px 16px;border-bottom:3px solid var(--ink)}
  header .marca{display:flex;align-items:center;gap:11px;font-weight:750;font-size:16px}
  header .marca img{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.18)}
  header .sub{font-size:12.5px;opacity:.85;margin-top:6px}
  main{max-width:680px;margin:0 auto;padding:16px}
  h3{font-size:14px;margin:22px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h3:first-of-type{margin-top:6px}
  h3 .qtd{font-size:11.5px;font-weight:700;background:#fff;border:1px solid var(--line);
    border-radius:20px;padding:2px 9px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;
    box-shadow:0 2px 14px rgba(16,24,40,.06)}
  .vazio{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:22px 16px;
    text-align:center;color:var(--muted);font-size:13.5px}
  .barra{display:flex;gap:10px;align-items:center;justify-content:space-between;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:12.5px;
    color:var(--muted);position:sticky;top:8px;z-index:5}
  .cab{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .cod{font-size:17px;font-weight:800;letter-spacing:.2px}
  .tipo{font-size:12.5px;color:var(--muted);margin-top:1px}
  .chip{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;
    padding:3px 9px;border-radius:20px;background:#fde8ea;color:var(--danger);border:1px solid #f6c6cc}
  .chip.azul{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}
  .chip.verde{background:#e9f9f1;color:#0a5c3b;border-color:#b6e8d1}
  .linhas{margin-top:11px;border-top:1px dashed var(--line);padding-top:9px}
  .linhas .l{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:4px 0}
  .linhas .l span{color:var(--muted)}
  .linhas .l b{text-align:right}
  .fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px}
  .slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;min-height:96px;border:1.6px dashed #b9c4d4;border-radius:12px;background:#fbfcfe;
    color:var(--muted);font:inherit;font-size:11.5px;padding:6px;cursor:pointer;overflow:hidden}
  .slot span{font-size:24px;line-height:1}
  .slot em{font-style:normal;text-align:center}
  .slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .slot.cheio{border-style:solid;border-color:var(--ok);background:#e9f9f1}
  .slot.cheio::after{content:'trocar';position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.62);
    color:#fff;font-size:9.5px;padding:2px 6px;border-radius:6px;z-index:2}
  label.campo{display:block;margin-top:11px;font-size:12.5px;color:var(--muted);font-weight:700}
  input[type=text],input[type=tel],select{width:100%;margin-top:5px;padding:12px 13px;font:inherit;font-size:16px;
    border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text)}
  input:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px}
  .acoes{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 18px;font-weight:700}
  .btn{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--ink);flex:1;min-width:180px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sec{background:#fff;color:var(--text);border:1px solid var(--line);flex:none;min-width:0}
  .btn.mini{padding:8px 13px;font-size:12.5px;border-radius:9px;background:#fff;border:1px solid var(--line);flex:none}
  .aviso{background:#fff8e6;border:1px solid #f2dfae;border-radius:12px;padding:11px 13px;font-size:12.5px;color:#6b5310}
  .aviso.erro{background:#ffecee;border-color:#f6c6cc;color:#8b1a24}
  .aviso.bom{background:#e9f9f1;border-color:#b6e8d1;color:#0a5c3b}
  .aviso.forte{font-size:14px;padding:16px;text-align:center;font-weight:700}
  .escondido{display:none !important}
  .rodape{max-width:680px;margin:6px auto 0;padding:0 16px;font-size:11.5px;color:var(--muted);text-align:center}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:#fff;
    padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:40;max-width:92vw;
    box-shadow:0 8px 30px rgba(0,0,0,.28)}
  .scanbox{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:6px;border:1px solid var(--line);
    border-radius:12px;padding:10px;background:#fbfcfe}
  .scanbox .btn.sec{flex:1;min-width:170px}
  .scanst{font-size:12.5px;font-weight:700;color:var(--muted)}
  .scanst.ok{color:var(--ok)} .scanst.erro{color:var(--danger)}
  .visor{position:fixed;inset:0;background:#0b0b0b;z-index:70;display:flex;flex-direction:column}
  .visor .vtop{display:flex;align-items:center;gap:10px;padding:14px 16px;color:#fff;font-weight:750;font-size:14.5px;
    border-bottom:1px solid #222}
  .visor .vtop button{margin-left:auto;background:#222;color:#fff;border:1px solid #333;border-radius:10px;
    padding:8px 13px;font-weight:700;font-size:13.5px}
  .vwrap{position:relative;flex:1;min-height:230px;background:#000;overflow:hidden}
  .vwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .mira{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(70vw,270px);height:min(70vw,270px);
    border:3px solid var(--brand);border-radius:20px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);pointer-events:none}
  .vmsg{padding:12px 18px 4px;color:#fff;font-size:13.5px;text-align:center;min-height:34px}
  .vmanual{display:none;gap:8px;padding:8px 16px 0}
  .vmanual.on{display:flex}
  .vmanual input{flex:1;padding:11px 12px;font-size:16px;border:1px solid #333;border-radius:10px;background:#000;color:#fff}
  .vmanual button{border:0;border-radius:10px;padding:0 18px;font-weight:800;background:var(--brand);color:var(--ink)}
  .vbot{display:flex;gap:9px;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
  .vbot button{flex:1;border:1px solid #333;border-radius:11px;padding:13px 10px;font-weight:700;background:#1c1c1c;
    color:#fff;font-size:14px}
  .acende{animation:acende .9s ease 2}
  @keyframes acende{0%,100%{box-shadow:0 0 0 0 rgba(255,229,0,0)}50%{box-shadow:0 0 0 6px rgba(255,229,0,.9)}}
</style>
</head>
<body>
<header>
  <div class="marca"><img src="/assets/logo-veeloway.jpeg" alt="VeeLo Way"><span id="empresa">VeeLo Way</span></div>
  <div class="sub">Vistoria de saída e de chegada — este aparelho não entra no sistema</div>
</header>

<main>
  <div id="telaErro" class="aviso erro escondido" style="margin-bottom:14px"></div>

  <div class="barra" id="barra">
    <span id="situacao">Carregando a fila…</span>
    <button class="btn mini" id="btnScanTopo">Escanear patinete</button>
    <button class="btn mini" id="btnAtualizar">Atualizar</button>
  </div>

  <div id="avisoGeral" class="escondido" style="margin-top:12px"></div>

  <h3>Aguardando liberação <span class="qtd" id="qtdPend"></span></h3>
  <div id="fila"></div>

  <h3>Na rua — registrar a chegada <span class="qtd" id="qtdRua"></span></h3>
  <div id="rua"></div>

  <h3>Hoje no celular <span class="qtd" id="qtdHoje"></span></h3>
  <div id="hoje"></div>
</main>

<div class="rodape">Link público da vistoria. Escaneie a etiqueta do patinete, fotografe e marque o horário — a cobrança é fechada no balcão.</div>
<input type="file" id="arquivo" accept="image/*" capture="environment" class="escondido">

<script>
(function(){
  'use strict';
  const qs = new URLSearchParams(location.search);
  let token = qs.get('token') || '';
  if(!token){
    const partes = location.pathname.split('/').filter(Boolean);
    const ultimo = partes[partes.length-1] || '';
    if(ultimo && ultimo !== 'vistoria.html') token = ultimo;
  }

  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const brl = n => 'R$ ' + (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const hhmm = ts => new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const ha = ts => {
    if(!ts) return '—';
    const min = Math.max(0, Math.round((Date.now()-ts)/60000));
    if(min < 1) return 'agora';
    if(min < 60) return 'há ' + min + ' min';
    return 'há ' + Math.floor(min/60) + ' h ' + (min%60) + ' min';
  };

  let dados = null, sujo = false, postando = false, carregando = false;
  const fotos = {};     /* locacaoId -> [foto, foto, foto] */
  const campos = {};    /* locacaoId -> { veiculo, obs, estado, scanErro } */
  const LEG = ['Frente','Lateral','Detalhe'];

  function aviso(txt, tipo){
    const el = $('#avisoGeral');
    if(!txt){ el.className = 'escondido'; el.innerHTML = ''; return; }
    el.className = 'aviso ' + (tipo||'') ;
    el.innerHTML = txt;
  }
  let toastT;
  function toast(msg){
    let el = document.querySelector('.toast');
    if(!el){ el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg;
    clearTimeout(toastT);
    toastT = setTimeout(()=>{ el.remove(); }, 3200);
  }
  function travar(){
    document.querySelectorAll('.btn').forEach(b=>{ if(b.id!=='btnAtualizar') b.disabled = postando; });
  }

  /* ---------------- leitor da etiqueta do patinete ---------------- */
  let visorLeitor = null, visorTimer = null, visorModo = null, zxingP = null;

  function carregarZxing(){
    if(window.ZXing) return Promise.resolve(window.ZXing);
    if(!zxingP){
      zxingP = new Promise((ok, erro)=>{
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
        s.async = true;
        s.onload = ()=> window.ZXing ? ok(window.ZXing) : erro(new Error('leitor indisponível'));
        s.onerror = ()=> erro(new Error('sem internet para baixar o leitor'));
        document.head.appendChild(s);
      });
      zxingP.catch(()=>{ zxingP = null; });
    }
    return zxingP;
  }

  function normalizarCodigo(txt){
    let t = String(txt==null?'':txt).trim();
    const m = t.match(/^https?:\/\/[^\s]+\/([^\/\s#?]+)[^\s]*$/);
    if(m) t = m[1];
    return t.replace(/^veeloway:/i,'').trim();
  }

  function codigoDaLoc(locId){
    const achar = arr => (arr||[]).find(x => String(x.locacaoId) === String(locId));
    const l = achar(dados && dados.pendentes) || achar(dados && dados.naRua);
    return l ? String(l.codigo) : '';
  }

  function acharPorCodigo(cod){
    if(!dados) return null;
    const alvo = String(cod).toUpperCase();
    const achar = arr => (arr||[]).find(x => String(x.codigo).toUpperCase() === alvo);
    const p = achar(dados.pendentes); if(p) return { loc:p, onde:'pendente' };
    const r = achar(dados.naRua);      if(r) return { loc:r, onde:'rua' };
    const h = achar(dados.liberadas) || achar(dados.chegadas);
    if(h) return { loc:h, onde:'hoje' };
    return null;
  }

  function visorHtml(){
    return '<div class="visor" id="visor">'+
      '<div class="vtop"><span>Escanear o código do patinete</span>'+
        '<button type="button" id="vFecha">Fechar</button></div>'+
      '<div class="vwrap"><video id="vVideo" playsinline muted autoplay></video><div class="mira"></div></div>'+
      '<div class="vmsg" id="vMsg">Aponte a câmera para o QR ou a tarja de código da etiqueta.</div>'+
      '<div class="vmanual" id="vManual"><input type="text" id="vCodigo" placeholder="código da etiqueta, ex.: PAT-001" '+
        'autocapitalize="characters"><button type="button" id="vConfirma">OK</button></div>'+
      '<div class="vbot"><button type="button" id="vDigitar">Digitar o código</button>'+
        '<button type="button" id="vFecha2">Cancelar</button></div>'+
    '</div>';
  }

  function mostrarMensagem(txt, erro){
    const m = $('#vMsg'); if(!m) return;
    m.textContent = txt;
    m.style.color = erro ? '#ff9aa6' : '#fff';
  }

  function pararVideo(){
    try{ if(visorLeitor && typeof visorLeitor.reset === 'function') visorLeitor.reset(); }catch(e){}
    const v = $('#vVideo');
    if(v && v.srcObject){ try{ v.srcObject.getTracks().forEach(t=>t.stop()); }catch(e){} }
    visorLeitor = null;
  }

  function fecharVisor(){
    clearTimeout(visorTimer);
    pararVideo();
    const el = $('#visor'); if(el) el.remove();
    visorModo = null;
  }

  function abrirVisor(modo){
    if(postando) return;
    if($('#visor')) fecharVisor();
    visorModo = modo || { tipo:'topo' };
    document.body.insertAdjacentHTML('beforeend', visorHtml());
    $('#vFecha').onclick = fecharVisor;
    $('#vFecha2').onclick = fecharVisor;
    $('#vDigitar').onclick = ()=>{ $('#vManual').classList.toggle('on'); $('#vCodigo').focus(); };
    $('#vConfirma').onclick = ()=>{ const t = $('#vCodigo').value; if(t.trim()) aoLer(t); };
    $('#vCodigo').addEventListener('keydown', ev=>{
      if(ev.key === 'Enter' && ev.target.value.trim()) aoLer(ev.target.value);
    });
    clearTimeout(visorTimer);
    visorTimer = setTimeout(()=>{
      if(!$('#visor')) return;
      mostrarMensagem('Tempo esgotado. Toque em Escanear de novo — ou digite o código.', true);
      pararVideo();
    }, 60000);
    carregarZxing().then(iniciarVideo).catch(()=>{
      mostrarMensagem('Não consegui abrir a câmera aqui. Toque em Digitar o código.', true);
      const m = $('#vManual'); if(m) m.classList.add('on');
      pararVideo();
    });
  }

  function iniciarVideo(ZX){
    const video = $('#vVideo');
    const aoLerResposta = res=>{
      if(!res) return;
      const txt = res.getText ? res.getText() : String(res.text || '');
      if(txt) aoLer(txt);
    };
    const semCamera = ()=>{
      mostrarMensagem('Sem permissão de câmera. Toque em Digitar o código.', true);
      const m = $('#vManual'); if(m) m.classList.add('on');
    };
    try{
      visorLeitor = new ZX.BrowserMultiFormatReader();
      let p = null;
      /* prefere a câmera de trás; se esta versão não tiver o método, usa o comum */
      try{
        if(typeof visorLeitor.decodeFromConstraints === 'function'){
          p = visorLeitor.decodeFromConstraints({ audio:false, video:{ facingMode:{ ideal:'environment' } } },
                                                 video, aoLerResposta);
        }
      }catch(e){ p = null; }
      if(!p) p = visorLeitor.decodeFromVideoDevice(null, video, aoLerResposta);
      if(p && typeof p.catch === 'function') p.catch(semCamera);
      return p;
    }catch(e){
      semCamera();
      return Promise.resolve();
    }
  }

  function acender(locId){
    const cards = document.querySelectorAll('[data-card]');
    for(let i=0;i<cards.length;i++){
      if(String(cards[i].dataset.card) === String(locId)){
        cards[i].scrollIntoView({behavior:'smooth', block:'center'});
        cards[i].classList.add('acende');
        setTimeout(()=>cards[i].classList.remove('acende'), 2000);
        return;
      }
    }
  }

  function aoLer(txt){
    const lido = normalizarCodigo(txt);
    if(!lido) return;
    const modo = visorModo;
    fecharVisor();
    if(modo && modo.tipo === 'cartao'){
      const esperado = String(modo.codigo || '');
      const c = campos[modo.loc] || (campos[modo.loc] = { veiculo:'', obs:'' });
      if(!esperado || lido.toUpperCase() !== esperado.toUpperCase()){
        c.veiculo = ''; c.scanErro = lido;
        render();
        aviso('O código lido é <b>' + esc(lido) + '</b>, mas este cartão é <b>' +
          esc(esperado || 'outro patinete') + '</b>. Escaneie a etiqueta certa.', 'erro');
        toast('Código de outro patinete.');
        return;
      }
      c.veiculo = esperado; c.scanErro = '';
      render();
      aviso('');
      toast(esperado + ' identificado ✓');
      if(navigator.vibrate){ try{ navigator.vibrate(45); }catch(e){} }
      acender(modo.loc);
      return;
    }
    achouPorCodigo(lido);
  }

  function achouPorCodigo(lido){
    const a = acharPorCodigo(lido);
    if(!a){
      aviso('O código <b>' + esc(lido) + '</b> não está na fila de hoje.', 'erro');
      toast('Patinete não está na fila.');
      return;
    }
    if(a.onde === 'hoje'){
      toast(lido + ' já passou pela vistoria hoje.');
      $('#hoje').scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    const c = campos[a.loc.locacaoId] || (campos[a.loc.locacaoId] = { veiculo:'', obs:'' });
    c.veiculo = String(a.loc.codigo || lido); c.scanErro = '';
    aviso('');
    render();
    acender(a.loc.locacaoId);
    toast(a.loc.codigo + ' identificado ✓');
    if(navigator.vibrate){ try{ navigator.vibrate(45); }catch(e){} }
  }

  /* ---------------- câmera ---------------- */
  let alvo = null;
  function lerArquivo(f){
    const leitor = new FileReader();
    leitor.onload = ()=>{
      comprimir(leitor.result, dataUrl=>{
        if(!alvo) return;
        const lista = fotos[alvo.loc] || (fotos[alvo.loc] = [null,null,null]);
        lista[alvo.i] = dataUrl;
        sujo = true;
        render();
      });
    };
    leitor.readAsDataURL(f);
  }
  function comprimir(src, cb){
    const img = new Image();
    img.onload = ()=>{
      const max = 900;
      const escala = Math.min(1, max/Math.max(img.width||max, img.height||max));
      const cv = document.createElement('canvas');
      cv.width = Math.round((img.width||max)*escala);
      cv.height = Math.round((img.height||max)*escala);
      try{
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        cb(cv.toDataURL('image/jpeg',0.55));
      }catch(e){ cb(src); }
    };
    img.onerror = ()=> cb(src);
    img.src = src;
  }
  $('#arquivo').onchange = function(){
    const f = this.files && this.files[0];
    this.value = '';
    if(!f || !alvo) return;
    lerArquivo(f);
  };
  document.addEventListener('click', e=>{
    const slot = e.target.closest && e.target.closest('.slot');
    if(!slot || postando) return;
    alvo = { loc: slot.dataset.loc, i: +slot.dataset.i };
    $('#arquivo').click();
  });

  /* ---------------- render ---------------- */
  function grade(locId){
    const lista = fotos[locId] || [null,null,null];
    return '<div class="fotos">' + LEG.map((lg,i)=>{
      const f = lista[i];
      return '<button type="button" class="slot'+(f?' cheio':'')+'" data-loc="'+esc(locId)+'" data-i="'+i+'">'+
        (f ? '<img src="'+f+'" alt="'+esc(lg)+'">' : '<span>＋</span>') +
        '<em>'+esc(lg)+'</em></button>';
    }).join('') + '</div>';
  }
  function campo(locId, qual, ph, val){
    return '<input type="text" inputmode="text" data-loc="'+esc(locId)+'" data-campo="'+qual+'" '+
      'placeholder="'+esc(ph)+'" value="'+esc(val||'')+'">';
  }
  function blocoScan(locId, codigo){
    const c = campos[locId] || (campos[locId] = { veiculo:'', obs:'' });
    const ok = c.veiculo && String(c.veiculo).toUpperCase() === String(codigo).toUpperCase();
    return '<div class="scanbox">'+
      '<button type="button" class="btn sec" data-escanear="'+esc(locId)+'">Escanear código do patinete</button>'+
      '<span class="scanst '+(ok?'ok':(c.scanErro?'erro':''))+'">'+
        (ok ? '✓ ' + esc(codigo) + ' identificado'
            : (c.scanErro ? '✗ lido ' + esc(c.scanErro) + ' — escaneie de novo'
                          : 'aguardando a leitura da etiqueta'))+
      '</span></div>';
  }

  function cardLiberar(l){
    const c = campos[l.locacaoId] || (campos[l.locacaoId] = { veiculo:'', obs:'' });
    const exigirFoto = dados.exigirFoto !== false;
    const atraso = Date.now() - (l.pagoEm||0);
    return '<div class="card" data-card="'+esc(l.locacaoId)+'">'+
      '<div class="cab"><div><div class="cod">'+esc(l.codigo)+'</div>'+
        '<div class="tipo">'+esc(l.tipoNome)+'</div></div>'+
        '<div style="text-align:right"><span class="chip azul">pago '+esc(ha(l.pagoEm))+'</span></div></div>'+
      '<div class="linhas">'+
        '<div class="l"><span>Cliente</span><b>'+esc(l.clienteNome)+'</b></div>'+
        '<div class="l"><span>Pacote</span><b>'+esc(l.tarifaLabel)+' ('+(l.duracaoMin||0)+' min) · '+brl(l.valorBase||0)+' via '+esc(l.pagamento||'—')+'</b></div>'+
        (l.lacreEsperado ? '<div class="l"><span>Lacre no sistema</span><b>'+esc(l.lacreEsperado)+'</b></div>' : '')+
        (l.obsSaida ? '<div class="l"><span>Obs. da saída</span><b>'+esc(l.obsSaida)+'</b></div>' : '')+
      '</div>'+
      grade(l.locacaoId)+
      blocoScan(l.locacaoId, l.codigo)+
      '<label class="campo">Observações da vistoria'+campo(l.locacaoId, 'obs', 'ex: risco no paralama, bateria 100%', c.obs)+'</label>'+
      '<div class="acoes"><button class="btn" data-liberar="'+esc(l.locacaoId)+'">Vistoriado e liberar</button></div>'+
      (exigirFoto ? '<div class="tipo" style="margin-top:8px">Ao menos uma foto é obrigatória.</div>' : '')+
    '</div>';
  }

  function cardChegada(l){
    const c = campos[l.locacaoId] || (campos[l.locacaoId] = { veiculo:'', estado:'loja', obs:'' });
    const exigirFoto = dados.exigirFoto !== false;
    return '<div class="card" data-card="'+esc(l.locacaoId)+'">'+
      '<div class="cab"><div><div class="cod">'+esc(l.codigo)+'</div>'+
        '<div class="tipo">'+esc(l.tipoNome)+'</div></div>'+
        '<div style="text-align:right">'+
          (l.atrasado ? '<span class="chip">atrasado</span>' : '<span class="chip verde">no prazo</span>')+
        '</div></div>'+
      '<div class="linhas">'+
        '<div class="l"><span>Cliente</span><b>'+esc(l.clienteNome)+'</b></div>'+
        '<div class="l"><span>Devolução prevista</span><b>'+(l.fimPrevisto?hhmm(l.fimPrevisto):'—')+'</b></div>'+
        '<div class="l"><span>Saiu</span><b>'+(l.inicio?hhmm(l.inicio):'—')+' · '+esc(l.tarifaLabel||'')+'</b></div>'+
      '</div>'+
      grade(l.locacaoId)+
      blocoScan(l.locacaoId, l.codigo)+
      '<label class="campo">Estado do veículo'+
        '<select data-loc="'+esc(l.locacaoId)+'" data-campo="estado">'+
          '<option value="loja"'+(c.estado!=='manutencao'?' selected':'')+'>OK — volta para a loja</option>'+
          '<option value="manutencao"'+(c.estado==='manutencao'?' selected':'')+'>Com avaria — manutenção</option>'+
        '</select></label>'+
      '<label class="campo">Observações'+campo(l.locacaoId, 'obs', 'ex: bateria em 20%, paralama trincado', c.obs)+'</label>'+
      '<div class="acoes"><button class="btn" data-chegada="'+esc(l.locacaoId)+'">Registrar chegada</button></div>'+
      (exigirFoto ? '<div class="tipo" style="margin-top:8px">Ao menos uma foto é obrigatória.</div>' : '')+
    '</div>';
  }

  function render(){
    if(!dados) return;
    $('#empresa').textContent = dados.empresa && dados.empresa.nome ? dados.empresa.nome : 'VeeLo Way';

    const pend = dados.pendentes || [];
    $('#qtdPend').textContent = pend.length;
    $('#fila').innerHTML = pend.length
      ? pend.map(cardLiberar).join('')
      : '<div class="vazio">Nada na fila. Toda locação paga já foi liberada.</div>';

    const rua = dados.naRua || [];
    $('#qtdRua').textContent = rua.length;
    $('#rua').innerHTML = rua.length
      ? rua.map(cardChegada).join('')
      : '<div class="vazio">Nenhum veículo na rua.</div>';

    const hoje = (dados.liberadas || []).map(x=>
        '<div class="l"><span>'+esc(x.codigo)+' · '+esc(x.clienteNome)+'</span><b>'+hhmm(x.liberadaEm)+' · '+x.fotos+' foto(s)</b></div>').join('') +
      (dados.chegadas || []).map(x=>
        '<div class="l"><span>'+esc(x.codigo)+' chegou</span><b>'+hhmm(x.fimReal)+' · '+(x.fotosEntrada||0)+' foto(s)'+(x.lacreEntrada?' · lacre '+esc(x.lacreEntrada):'')+'</b></div>').join('');
    $('#qtdHoje').textContent = (dados.liberadas||[]).length + (dados.chegadas||[]).length;
    $('#hoje').innerHTML = hoje
      ? '<div class="card"><div class="linhas" style="border-top:0;padding-top:0;margin-top:0">'+hoje+'</div></div>'
      : '<div class="vazio">Nada registrado hoje por este link.</div>';

    travar();
  }

  /* ---------------- rede ---------------- */
  async function buscar(){
    if(postando || carregando) return;
    carregando = true;
    try{
      const r = await fetch('/api/vistoria?token=' + encodeURIComponent(token), { cache:'no-store' });
      const j = await r.json().catch(()=>({}));
      if(r.status === 401){
        $('#barra').classList.add('escondido');
        $('#fila').innerHTML = ''; $('#rua').innerHTML = ''; $('#hoje').innerHTML = '';
        const e = $('#telaErro');
        e.className = 'aviso erro forte';
        e.innerHTML = 'Link inválido ou expirado.<br><span style="font-weight:400;font-size:13px">'+
          'Peça um novo link da vistoria no balcão (Configurações → Link da vistoria).</span>';
        return;
      }
      if(!r.ok) throw new Error(j.mensagem || 'erro');
      dados = j;
      sujo = false;
      aviso('');
      render();
      $('#situacao').textContent = 'Atualizado às ' + hhmm(Date.now()) + ' · fila de ' +
        ((dados.pendentes||[]).length + (dados.naRua||[]).length);
    }catch(e){
      $('#situacao').textContent = 'Sem conexão — toque em Atualizar';
      if(!dados) aviso('Não consegui carregar a fila. Confira a internet e toque em Atualizar.', 'erro');
    }finally{
      carregando = false;
    }
  }

  async function enviar(acao, locId, corpo){
    if(postando) return;
    postando = true; travar();
    try{
      const r = await fetch('/api/vistoria', {
        method:'POST', headers:{'Content-Type':'application/json'},
        cache:'no-store',
        body: JSON.stringify(Object.assign({ token, acao, locacaoId: String(locId) }, corpo))
      });
      const j = await r.json().catch(()=>({}));
      if(!r.ok){
        aviso(esc(j.mensagem || 'Não consegui gravar. Tente de novo.'), 'erro');
        toast(j.mensagem || 'Não consegui gravar.');
        return;
      }
      delete fotos[locId]; delete campos[locId];
      sujo = false;
      dados = j;
      aviso('<b>' + (acao==='liberar' ? 'Liberado!' : 'Chegada registrada!') + '</b> ' +
        (acao==='liberar' ? 'O relógio da locação começou agora.' : 'A cobrança é fechada no balcão.'), 'bom');
      toast(acao==='liberar' ? 'Veículo liberado — relógio rodando.' : 'Chegada registrada.');
      render();
      $('#situacao').textContent = 'Atualizado às ' + hhmm(Date.now());
    }catch(e){
      aviso('Falha de conexão — a foto continua aqui na tela, envie de novo.', 'erro');
      toast('Sem conexão.');
    }finally{
      postando = false; travar();
    }
  }

  function validar(acao, locId, fotosEnviadas){
    if(dados.exigirFoto !== false && !fotosEnviadas.length){
      aviso('Tire ao menos uma foto da vistoria.', 'erro');
      return false;
    }
    const c = campos[locId] || {};
    const esperado = codigoDaLoc(locId);
    if(!c.veiculo || String(c.veiculo).toUpperCase() !== String(esperado).toUpperCase()){
      aviso('Escaneie a etiqueta do patinete (' + esc(esperado) + ') antes de continuar.', 'erro');
      toast('Escaneie o código do patinete.');
      return false;
    }
    return true;
  }

  document.addEventListener('click', e=>{
    const bs = e.target.closest && e.target.closest('[data-escanear]');
    const bl = e.target.closest && e.target.closest('[data-liberar]');
    const bc = e.target.closest && e.target.closest('[data-chegada]');
    if(bs){
      if(postando) return;
      const id = bs.dataset.escanear;
      abrirVisor({ tipo:'cartao', loc:id, codigo:codigoDaLoc(id) });
    }
    if(bl){
      const id = bl.dataset.liberar;
      const fs = (fotos[id]||[]).filter(Boolean);
      if(!validar('liberar', id, fs)) return;
      const c = campos[id] || {};
      enviar('liberar', id, { fotos: fs, veiculo: c.veiculo||'', obs: c.obs||'' });
    }
    if(bc){
      const id = bc.dataset.chegada;
      const fs = (fotos[id]||[]).filter(Boolean);
      if(!validar('chegada', id, fs)) return;
      const c = campos[id] || {};
      enviar('chegada', id, { fotos: fs, veiculo: c.veiculo||'',
                              estado: c.estado||'loja', obs: c.obs||'' });
    }
  });

  document.addEventListener('input', e=>{
    const el = e.target;
    if(!el.dataset || !el.dataset.campo || !el.dataset.loc) return;
    const id = el.dataset.loc;
    const c = campos[id] || (campos[id] = { veiculo:'', obs:'', estado:'loja' });
    c[el.dataset.campo] = el.value;
    sujo = true;
  });
  document.addEventListener('change', e=>{
    const el = e.target;
    if(!el.dataset || !el.dataset.campo || !el.dataset.loc) return;
    const id = el.dataset.loc;
    const c = campos[id] || (campos[id] = { veiculo:'', obs:'', estado:'loja' });
    c[el.dataset.campo] = el.value;
    sujo = true;
  });

  $('#btnAtualizar').onclick = ()=>{ if(postando) return; buscar(); };
  $('#btnScanTopo').onclick = ()=> abrirVisor({ tipo:'topo' });

  /* o celular não perde o que já fotografou: só recarrega sozinho quando
     ninguém está mexendo em nada */
  setInterval(()=>{
    if(postando || carregando) return;
    const focado = document.activeElement;
    const mexendo = focado && (focado.tagName === 'INPUT' || focado.tagName === 'SELECT' || focado.tagName === 'TEXTAREA');
    if(sujo || mexendo){ $('#situacao').textContent = 'Alterações não salvas — toque em Atualizar depois'; return; }
    buscar();
  }, 8000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !sujo) buscar(); });

  buscar();
})();
</script>
</body>
</html>
